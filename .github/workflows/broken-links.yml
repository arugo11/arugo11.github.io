name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
  pull_request:
    branches:
      - master
      - main
    paths:
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2.2"
          bundler-cache: true
      - name: Build site 🔧
        env:
          JEKYLL_ENV: production
          PAGES_REPO_NWO: arugo11/arugo11.github.io
        run: bundle exec jekyll build --baseurl ""

      - name: Link Checker 🔗
        uses: lycheeverse/lychee-action@v1.9.0
        with:
          fail: true
          lycheeVersion: 0.24.2
          # Exclude a flaky event page that frequently times out in CI.
          # removed md files that include liquid tags
          args: --user-agent 'curl/7.54' --base-url '${{ github.workspace }}/_site/' --exclude-path AGENTS.md --exclude-path CLAUDE.md --exclude-path CONTRIBUTING.md --exclude-path CUSTOMIZE.md --exclude-path FAQ.md --exclude-path INSTALL.md --exclude-path README.md --exclude-path _site --exclude-path _templates --exclude-path node_modules --exclude-path vendor --exclude-path _pages/404.md --exclude-path _pages/about_me.md --exclude-path _pages/blog.md --exclude-path _pages/projects.md --exclude-path _posts/2018-12-22-distill.md --exclude-path _posts/2023-04-24-videos.md --exclude 'https://hackathon-nttdata-mse.voltmind.jp/' --exclude 'https://www.nikko-pc.com/site/case/2026-04(12|26)gi/' --verbose --no-progress './**/*.md' './**/*.html'
